# ==============================================================================
# TacticX Local Continuous Production (Phase 31)
# Usage: cp .env.example .env && docker compose -f docker-compose.local.yml up -d
# NEVER commit .env (keys, passwords, tokens). See .env.example for all vars.
# ==============================================================================
name: tacticx-local

services:
  tacticx-postgres:
    image: postgres:16-alpine
    container_name: tacticx-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bet}
      POSTGRES_DB: ${POSTGRES_DB:-betpredictor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tacticx-local

  tacticx-redis:
    image: redis:7-alpine
    container_name: tacticx-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata-local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tacticx-local

  migration:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: tacticx-local-migration
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bet}:${POSTGRES_PASSWORD:-bet}@tacticx-postgres:5432/${POSTGRES_DB:-betpredictor}
    depends_on:
      tacticx-postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - tacticx-local
    profiles: ["migration", "tools"]

  tacticx-api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: tacticx-local-api
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      TACTICX_ENV: local-production
      ENVIRONMENT: production
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bet}:${POSTGRES_PASSWORD:-bet}@tacticx-postgres:5432/${POSTGRES_DB:-betpredictor}
      REDIS_URL: redis://tacticx-redis:6379/0
      CELERY_BROKER_URL: redis://tacticx-redis:6379/1
      CELERY_RESULT_BACKEND: redis://tacticx-redis:6379/2
      ENABLE_OPERATIONAL_ENDPOINTS: "false"
    depends_on:
      tacticx-postgres:
        condition: service_healthy
      tacticx-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tacticx-local

  tacticx-scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: tacticx-local-scheduler
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      TACTICX_ENV: local-production
      ENVIRONMENT: production
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bet}:${POSTGRES_PASSWORD:-bet}@tacticx-postgres:5432/${POSTGRES_DB:-betpredictor}
      REDIS_URL: redis://tacticx-redis:6379/0
      CELERY_BROKER_URL: redis://tacticx-redis:6379/1
      CELERY_RESULT_BACKEND: redis://tacticx-redis:6379/2
    depends_on:
      tacticx-postgres:
        condition: service_healthy
      tacticx-redis:
        condition: service_healthy
    command: ["python", "scripts/tacticx.py", "jobs", "run-due", "--loop"]
    healthcheck:
      # NOTE: python:slim images ship no pgrep/ps; inspect /proc directly.
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any('run-due' in open('/proc/%s/cmdline' % p,'rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tacticx-local

  tacticx-frontend:
    build:
      context: ./frontend
    container_name: tacticx-local-frontend
    restart: unless-stopped
    depends_on:
      tacticx-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      # NOTE: use 127.0.0.1, not localhost — minimal images may not
      # listen on ::1, and wget tries IPv6 first.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tacticx-local

volumes:
  pgdata-local:
  redisdata-local:

networks:
  tacticx-local:
    driver: bridge
